<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopping cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="logo">shopCart</h1>
    </header>
    <main class="main">
        <h1 class="text">products</h1>
        <div class="div">
            <article class="products">
            <h2 class="product">Wirelees headphone</h2>
            <h3 class="product-type">electronic</h3>
            <p>$49</p>
            <button class="add-btn" data-id="1">Add</button>
        </article> 
        
        <article class="products">
            <h2 class="product">Machenical Keyboard</h2>
            <h3 class="product-type">electronic</h3>
            <p>$89</p>
            <button class="add-btn" data-id="2">Add</button>
        </article> 

        <article class="products">
            <h2 class="product">Coffe Mug</h2>
            <h3 class="product-type">Kithen</h3>
            <p>$14</p>
            <button class="add-btn" data-id="3">Add</button>
        </article> 

        <article class="products">
            <h2 class="product">NoteBook</h2>
            <h3 class="product-type">Stationary</h3>
            <p>$9</p>
            <button class="add-btn" data-id="4">Add</button>
        </article> 

        <article class="products">
            <h2 class="product">USB-C Cable</h2>
            <h3 class="product-type">electronic</h3>
            <p>$12</p>
            <button class="add-btn" data-id="5">Add</button>
        </article> 

        <article class="products">
            <h2 class="product">Mouse Pad </h2>
            <h3 class="product-type">Electronic</h3>
            <p>$18</p>
            <button class="add-btn" data-id="6">Add</button>
        </article> 

        <article class="products">
            <h2 class="product">Water Bottle</h2>
            <h3 class="product-type">Home</h3>
            <p>$25</p>
            <button class="add-btn" data-id="7">Add</button>
        </article> 
        </div>
    </main>
    <footer class="footer">
            <div>
                <h1>Your Cart</h1>
                <button class="clearbtn">Clear all</button>
            </div>
            <ul class="list"></ul>
            <div class="total">
                <h4>Total: <span>$00</span></h4>
                <button class="checkout">CheckOut</button>
            </div>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
