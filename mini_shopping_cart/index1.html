<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>Shopping Cart</title>

</head>

<body>

    <div class="container">

        <h1>Mini Shopping Cart</h1>

        <div class="products">

            <div class="product-card">
                <img src="https://via.placeholder.com/150">
                <h3>Shoes</h3>
                <p>₹1500</p>
                <button class="add-btn">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150">
                <h3>Watch</h3>
                <p>₹2500</p>
                <button class="add-btn" >Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150">
                <h3>Headphone</h3>
                <p>₹3500</p>
                <button class="add-btn" >Add to Cart</button>
            </div>

        </div>

        <div class="cart">
            <h2>Your Cart</h2>

            <div class="cart-items">

            </div>

            <h3 class="total-cart">Total : ₹0</h3>

            <button class="clear-cart">
                Clear Cart
            </button>

        </div>

    </div>
<script  src="app.js"></script>
</body>

</html>
